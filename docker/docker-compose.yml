services:
  mysql:
    image: mysql:8.0
    container_name: cloudbox-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cloudbox}
      MYSQL_USER: ${MYSQL_USER:-cloudbox}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cloudbox123456}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cloudbox-net

  redis:
    image: redis:7
    container_name: cloudbox-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cloudbox-net

volumes:
  mysql_data:
    name: cloudbox-mysql-data
  redis_data:
    name: cloudbox-redis-data

networks:
  cloudbox-net:
    name: cloudbox-net
    driver: bridge
